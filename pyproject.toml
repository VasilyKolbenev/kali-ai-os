[project]
name = "kali"
version = "0.2.0-beta"
description = "KALI — Kernel Agent Lifecycle Intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "watchfiles>=1.0.0",
    "python-dotenv>=1.0.1",
    "sounddevice>=0.5.1",
    "numpy>=2.0.0",
    "faster-whisper>=1.1.0",
    "piper-tts>=1.2.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "plyer>=2.1.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "python-telegram-bot>=21.0",
    "elevenlabs>=2.42.0",
    "faiss-cpu>=1.13.2",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "onnxruntime-directml>=1.24.4",
    "torch>=2.6.0",
    "omegaconf>=2.3.0",
    "croniter>=6.2.2",
    "pillow>=12.2.0",
    "openwakeword>=0.4.0",
    "soundfile>=0.13.1",
    "torchaudio>=2.6.0",
    "f5-tts>=1.1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]

# PyTorch with CUDA 12.4 for RTX 50/40 series (Blackwell/Ada)
# CPU users: F5-TTS too slow → use Elevenlabs cloud fallback
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
