[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI Command Center"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "watchfiles>=1.0.0",
    "python-dotenv>=1.0.1",
    "sounddevice>=0.5.1",
    "numpy>=2.0.0",
    "onnxruntime>=1.19.0",
    "faster-whisper>=1.1.0",
    "piper-tts>=1.2.0",
    "anthropic>=0.40.0",
    "plyer>=2.1.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
