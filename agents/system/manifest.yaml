name: system
version: "1.0.0"
description: "System information, RAM, NVIDIA GPU load, time, and timers."
capabilities:
  - system.info
  - system.timer
tools:
  - name: get_time
    description: "Get current date and time"
    parameters: {}
  - name: get_system_info
    description: "Get system platform, disk space, RAM usage, and NVIDIA GPU load/VRAM."
    parameters: {}
  - name: set_timer
    description: "Set a countdown timer"
    parameters:
      seconds: { type: integer, description: "Timer duration in seconds" }
      label: { type: string, description: "Timer label" }
protocol: native
permissions: []
