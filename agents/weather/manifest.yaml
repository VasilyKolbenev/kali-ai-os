name: weather
version: "1.0.0"
description: "Weather information via Open-Meteo API"
capabilities:
  - weather.current
  - weather.forecast
tools:
  - name: get_weather
    description: "Get current weather for a location"
    parameters:
      city: { type: string, description: "City name (e.g. 'Moscow', 'New York')" }
  - name: get_forecast
    description: "Get weather forecast for next 3 days"
    parameters:
      city: { type: string, description: "City name" }
protocol: native
permissions:
  - network
