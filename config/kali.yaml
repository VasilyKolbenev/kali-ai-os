# KALI Configuration
server:
  host: "127.0.0.1"
  port: 3005

voice:
  wake_word: "jarvis"
  mode: "wake_word"                   # wake_word | push_to_talk | off
  stt_model: "small"
  tts_voice: "default"
  vad_threshold: 0.5
  auto_start: true                    # If true: pipeline starts with app, Jarvis listens for wake-word in background. Otherwise on-demand.

llm:
  cloud_provider: "openai"            # "anthropic" or "openai"
  cloud_model: "gpt-5.4-mini"              # gpt-5.4, gpt-5.4-mini, gpt-5.4-nano, claude-sonnet-4-20250514
  local_provider: "ollama"
  local_model: "llama3"
  auto_route: true

schedule:
  morning_hour: 8
  evening_hour: 22
