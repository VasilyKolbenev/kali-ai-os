# KALI Configuration
server:
  host: "127.0.0.1"
  port: 8000

voice:
  wake_word: "jarvis"
  mode: "wake_word"
  stt_model: "base"
  tts_voice: "default"
  vad_threshold: 0.5

llm:
  cloud_provider: "openai"            # "anthropic" or "openai"
  cloud_model: "gpt-5.4-mini"              # gpt-5.4, gpt-5.4-mini, gpt-5.4-nano, claude-sonnet-4-20250514
  local_provider: "ollama"
  local_model: "llama3"
  auto_route: true

schedule:
  morning_hour: 8
  evening_hour: 22
