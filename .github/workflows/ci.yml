# CI v1 — the four test gates that were previously run only by hand.
# GPU-dependent work (F5 synth, frozen smoke, quality gates) stays a local
# release ritual — runners have no GPU; everything here is CPU-mockable.
# Lint (ruff/mypy) intentionally NOT wired yet: kernel carries 146 pre-existing
# ruff errors — cleanup rides along with the main.py split, then lint lands.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # torch+cu128 wheels are huge; stock runners run out of disk without this.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # kernel.voice.recorder imports sounddevice at module level, which
      # dlopens PortAudio even in tests.
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps (frozen lock)
        # pytest lives in the `dev` extra (optional-dependencies), which
        # uv sync does not install by default.
        run: uv sync --frozen --extra dev

      - name: Kernel test suite
        run: uv run pytest tests/kernel tests/test_voice_tool_dispatch.py -q

      - name: Core-loop marker (the release gate subset)
        run: uv run pytest -m core_loop -q

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # windows-2025 images ship a partial MSVC install; rustc's auto-detected
      # link.exe path doesn't exist. This action initializes the MSVC env.
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo check (lib)
        run: cargo check --lib
        working-directory: src-tauri
        env:
          # src-tauri/.cargo/config.toml pins a local machine's absolute
          # link.exe path; env beats config in cargo, so resolve the linker
          # from the msvc-dev-cmd PATH instead.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
