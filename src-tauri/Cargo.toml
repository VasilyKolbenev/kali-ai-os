[package]
name = "kali-desktop"
version = "1.0.0-rc3"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = "3"

# Rust backend migration — Phase 0 onwards
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
# auto-update: SHA-256 верификация ассетов
sha2 = "0.10"
# auto-update: сравнение версий манифеста (rc-pre-release семантика из коробки)
semver = "1"
# auto-update: свободное место на диске перед скачиванием 4.2 GB
fs4 = "0.13"
hex = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
# ort 2.x — ONNX Runtime Rust bindings. Default features include
# `download-binaries` which fetches the prebuilt ORT runtime at build
# time (~10 MB), so no system install or manual DLL placement needed.
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }
# Pin to the same ndarray major as `ort` uses internally — passing
# arrays across the crate boundary requires identical versions
# (cargo treats different majors as different types).
ndarray = "0.17"
# cpal — de-facto Rust audio I/O. Used by `recorder.rs` (16 kHz mono i16
# input). Plan called for 0.16 but latest stable on 2026-04-28 is 0.17;
# minor bump, no API breakage in our usage.
cpal = "0.17"
# rubato — pure-Rust sample-rate conversion. recorder.rs resamples the
# device's native capture rate (often 48 kHz, and frequently the only
# format a laptop mic array exposes) down to the 16 kHz mono the
# VAD/wake/STT path needs — anti-aliased (FFT), NOT naive decimation.
rubato = "0.15"
# rodio — built on cpal, used by `playback.rs` (TTS waveforms +
# jarvis_sounds/*.wav). Default features include WAV via symphonia which
# we want; leaving MP3/FLAC/Vorbis on for forward-compat with future
# bundled audio assets.
rodio = "0.22"
# dirs — cross-platform user data / cache / config directories. Used
# by `skills::registry` to locate the writable user-skills dir
# (`%APPDATA%/KALI/skills` on Windows; XDG data dir elsewhere).
dirs = "5"
# getrandom — thin wrapper over the OS CSPRNG (BCryptGenRandom on Windows,
# getrandom(2)/urandom on Unix). Used by `backend::auth` to mint the
# per-install control-plane token. 0.2.x is already in the dep graph
# transitively; pinning it direct keeps the `getrandom::getrandom` API.
getrandom = "0.2"
# local-ip-address — resolve the primary non-loopback LAN IPv4 so the
# desktop pairing view can build the `kali://pair?ip=…` QR the phone
# scans. Pure-Rust, reads the OS interface table (GetAdaptersAddresses on
# Windows, getifaddrs on Unix); no network traffic.
local-ip-address = "0.6"
# crash-репорт: редакция секретов в логах перед показом/передачей.
regex = "1"

[features]
ml-tests = []
# Manual playback verification (1 s 440 Hz tone) — listen-only test, no
# programmatic assertion of audibility. Off by default.
audio-tests = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
tokio-tungstenite = "0.21"
tempfile = "3"
# tower::ServiceExt::oneshot — drive the auth-wrapped router in-process for
# the middleware contract tests (already in the graph via tower-http).
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
