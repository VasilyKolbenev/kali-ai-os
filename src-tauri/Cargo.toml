[package]
name = "kali-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = "3"

# Rust backend migration — Phase 0 onwards
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }
futures-util = { version = "0.3", features = ["sink"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
# ort 2.x — ONNX Runtime Rust bindings. Default features include
# `download-binaries` which fetches the prebuilt ORT runtime at build
# time (~10 MB), so no system install or manual DLL placement needed.
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }
# Pin to the same ndarray major as `ort` uses internally — passing
# arrays across the crate boundary requires identical versions
# (cargo treats different majors as different types).
ndarray = "0.17"
# cpal — de-facto Rust audio I/O. Used by `recorder.rs` (16 kHz mono i16
# input). Plan called for 0.16 but latest stable on 2026-04-28 is 0.17;
# minor bump, no API breakage in our usage.
cpal = "0.17"
# rodio — built on cpal, used by `playback.rs` (TTS waveforms +
# jarvis_sounds/*.wav). Default features include WAV via symphonia which
# we want; leaving MP3/FLAC/Vorbis on for forward-compat with future
# bundled audio assets.
rodio = "0.22"

[features]
ml-tests = []
# Manual playback verification (1 s 440 Hz tone) — listen-only test, no
# programmatic assertion of audibility. Off by default.
audio-tests = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
tokio-tungstenite = "0.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }
